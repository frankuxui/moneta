name: moneta-test
services:
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: moneta_test
      POSTGRES_USER: moneta
      POSTGRES_PASSWORD: test-only-local
    ports: ['127.0.0.1:5439:5432']
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U moneta -d moneta_test']
      interval: 2s
      retries: 20
